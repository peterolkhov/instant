name: Instant native numeric BEFORE diagnosis
on:
  push:
    branches: [codex/diagnose-row-number-exponents]
permissions:
  contents: read
jobs:
  before:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: instantdb/instant
          ref: 15358ad712df6879b8953ee8289af0e891d4dde8
          path: upstream
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.14.0'
      - name: Materialize untracked finite fixtures
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,pathlib
          p=pathlib.Path('upstream/client/packages/components/.diagnostic');p.mkdir()
          files={'probe.mjs': '', 'main.tsx': '', 'index.html': 'PCFkb2N0eXBlIGh0bWw+PGh0bWw+PGhlYWQ+PG1ldGEgY2hhcnNldD0idXRmLTgiPjwvaGVhZD48Ym9keT48ZGl2IGlkPSJyb290Ij48L2Rpdj48c2NyaXB0IHR5cGU9Im1vZHVsZSIgc3JjPSIvbWFpbi50c3giPjwvc2NyaXB0PjwvYm9keT48L2h0bWw+Cg==', 'context.ts': 'Ly8gVGhlIG93bmVyIHVzZXMgdGhpcyBob29rIHNvbGVseSBmb3IgQ29kZUVkaXRvci5kYXJrTW9kZSwgYWJzZW50IGluIG51bWJlciBjYXNlcy4KZXhwb3J0IGNvbnN0IHVzZUV4cGxvcmVyUHJvcHMgPSAoKSA9PiAoeyBkYXJrTW9kZTogZmFsc2UgfSk7Cg==', 'vite.config.mts': '', 'manifest.json': '', 'guard.py': ''}
          for name,data in files.items():(p/name).write_bytes(base64.b64decode(data))
          PY
      - name: Whole native tree before guard
        run: python3 upstream/client/packages/components/.diagnostic/guard.py upstream before
      - name: Install declared filtered upstream dependencies without lifecycle scripts
        working-directory: upstream/client
        run: |
          corepack enable
          corepack prepare pnpm@10.2.0 --activate
          pnpm --filter @instantdb/components... install --frozen-lockfile --ignore-scripts
      - name: Install Chromium
        working-directory: upstream/client/packages/core
        run: pnpm exec playwright install --with-deps chromium
      - name: Exercise untouched owner in Chromium and capture native transaction
        working-directory: upstream/client/packages/components
        shell: bash
        run: |
          pnpm exec vite --config .diagnostic/vite.config.mts > /tmp/instant-vite.log 2>&1 &
          task_vite_pid=$!
          trap 'kill "$task_vite_pid" || true; tail -60 /tmp/instant-vite.log' EXIT
          timeout 180 node .diagnostic/probe.mjs
      - name: Whole native tree after guard
        if: always()
        run: python3 upstream/client/packages/components/.diagnostic/guard.py upstream after
