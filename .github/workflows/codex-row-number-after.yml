name: Instant row number native implementation verification
on:
  push:
    branches: [codex/validate-row-number-exponents]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CANDIDATE_SHA: be3dc34cddfffc0e0fa4011bdca5438df12e2b38
      CANDIDATE_TREE: a774fc6a87d5773ea7ffaf2adad1ac5d96b63741
      CI: 'true'
    steps:
      - name: Exact original source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: instantdb/instant
          ref: 15358ad712df6879b8953ee8289af0e891d4dde8
          path: original
          fetch-depth: 0
          persist-credentials: false
      - name: Exact source-only candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: peterolkhov/instant
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.14.0'
          package-manager-cache: false
      - name: Materialize frozen finite native packet
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import base64,hashlib,json,os,pathlib,zlib
          data=base64.b64decode('',validate=True)
          assert hashlib.sha256(data).hexdigest()=='2b2b9d76952ca418d438d824db940a9e2dcc0ad7f59a8435f48662ccb961847b'
          packet=json.loads(zlib.decompress(data))
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'instant-native-after';root.mkdir()
          for name,text in packet.items():
              assert '/' not in name and name not in ('.','..')
              (root/name).write_text(text)
          print('PACKET_SHA256=2b2b9d76952ca418d438d824db940a9e2dcc0ad7f59a8435f48662ccb961847b')
          PYTHON
      - name: Install exact declared filtered dependencies without lifecycle scripts
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.2.0 --activate
          pnpm --dir original/client --filter @instantdb/components... install --frozen-lockfile --ignore-scripts
          pnpm --dir candidate/client --filter @instantdb/components... install --frozen-lockfile --ignore-scripts
      - name: Install native Chromium
        working-directory: original/client/packages/core
        run: pnpm exec playwright install --with-deps chromium
      - name: Native baseline, original parser RED, candidate GREEN, type, format, build and browser transaction proof
        shell: bash
        run: python3 "$RUNNER_TEMP/instant-native-after/native_after.py" "$RUNNER_TEMP/instant-native-after"
